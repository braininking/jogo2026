name: OfertaRadar - Radar a cada 10 minutos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: ofertaradar-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Executar radar
        env:
          RADAR_URL: https://ofertaradar.onrender.com/api/radar
        run: |
          set -e
          echo "Executando OfertaRadar em $(date -u)"
          curl --fail-with-body --silent --show-error --max-time 180 "$RADAR_URL" -o radar.json
          echo "Radar executado com sucesso."
          cat radar.json
